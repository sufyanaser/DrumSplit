[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drumsplit"
version = "0.1.0"
description = "Windows-compatible wrapper for the inagoy DrumSep Hybrid Demucs model"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Sufyan Nasser Ali"}]
dependencies = [
  "demucs>=4.0.1,<5",
  "gdown>=5.2,<6",
  "soundfile>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
drumsplit = "drumsplit.cli:main"
drumsplit-setup = "drumsplit.setup_model:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
