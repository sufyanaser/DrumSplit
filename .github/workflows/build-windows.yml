name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest -q

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name DrumSplit `
            --collect-all demucs `
            --collect-all torch `
            --collect-all torchaudio `
            --collect-all soundfile `
            --hidden-import drumsplit.gui `
            run_gui.py

      - name: Verify application
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/DrumSplit/DrumSplit.exe")) {
            throw "DrumSplit.exe was not produced."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\DrumSplit.iss"
          if (-not (Test-Path "dist\installer\DrumSplit-Setup-0.2.0-x64.exe")) {
            throw "Installer EXE was not produced."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: DrumSplit-Setup-0.2.0-x64
          path: dist/installer/DrumSplit-Setup-0.2.0-x64.exe
          if-no-files-found: error
          retention-days: 14
